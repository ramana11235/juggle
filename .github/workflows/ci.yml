# Every pull request and push to main runs the checks and every browser test
# against a local Juggle. A push to main then deploys, once all of them pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/check-tests.mjs
      - run: npx vitest run

  # The browser jobs run in Playwright's own image for the version the
  # project uses, which holds the browsers and the system packages they need,
  # so no job installs them.
  playwright:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  # Each local browser test has a Juggle of its own, so the suite is split
  # across machines that run at the same time.
  browser:
    needs: playwright
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright test --shard=${{ matrix.shard }}/4

  deploy:
    if: github.event_name == 'push'
    needs: [checks, browser, playwright]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}
    # Every deploy's beta tests share beta's one database, so only one deploy
    # runs at a time, and a waiting one is never cancelled.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Write the hosting config git does not keep
        env:
          WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
          WRANGLER_BETA_JSONC: ${{ secrets.WRANGLER_BETA_JSONC }}
          BETA_TOKENS_JSON: ${{ secrets.BETA_TOKENS_JSON }}
        run: |
          printf '%s' "$WRANGLER_JSONC" > wrangler.jsonc
          printf '%s' "$WRANGLER_BETA_JSONC" > wrangler.beta.jsonc
          printf '%s' "$BETA_TOKENS_JSON" > beta-tokens.json
          node scripts/mask-hosting-values.mjs
      - run: npm ci
      - run: npm run deploy
