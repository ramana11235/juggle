# Every pull request and push to main runs the checks and every browser test
# against a local Juggle. A push to main then deploys beta, tests it through
# real Access, and only then deploys prod, each stage waiting for the last.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Beta has one database and one deployed copy, so pushes to main run one at
# a time: a later push never deploys beta while an earlier one is testing it.
# A waiting run is never cancelled. Pull requests do not deploy, so each runs
# on its own.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy' || format('pull-request-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  check-code:
    name: check code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the types
        run: npm run typecheck
      - name: Check the tests follow the test rules
        run: node scripts/check-tests.mjs
      - name: Check the screens follow the design rules
        run: node scripts/check-design.mjs

  test-worker:
    name: test the Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test the Worker in workerd
        run: npx vitest run

  # The browser jobs run in Playwright's own image for the version the
  # project uses, which holds the browsers and the system packages they need,
  # so no job installs them.
  playwright:
    name: find the Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  # Each local browser test has a Juggle of its own, so the suite is split
  # across machines that run at the same time.
  test-locally:
    name: test locally (${{ matrix.shard }}/4)
    needs: playwright
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test in browsers against a local Juggle
        run: npx playwright test --shard=${{ matrix.shard }}/4

  deploy-beta:
    name: deploy beta
    if: github.event_name == 'push'
    needs: [check-code, test-worker, test-locally]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hosting
        with:
          wrangler-jsonc: ${{ secrets.WRANGLER_JSONC }}
          wrangler-beta-jsonc: ${{ secrets.WRANGLER_BETA_JSONC }}
          beta-tokens-json: ${{ secrets.BETA_TOKENS_JSON }}
      - name: Migrate beta's database
        run: npx wrangler d1 migrations apply DB --remote -c wrangler.beta.jsonc
      - name: Deploy beta
        run: WRANGLER_CONFIG=wrangler.beta.jsonc npx vite build && npx wrangler deploy

  # Only the browser tests whose path depends on what real Cloudflare adds,
  # tagged @beta, run against beta through real Access.
  test-beta:
    name: test beta
    needs: [deploy-beta, playwright]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}
    # The tests empty beta's database before and after each one through wrangler.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hosting
        with:
          wrangler-jsonc: ${{ secrets.WRANGLER_JSONC }}
          wrangler-beta-jsonc: ${{ secrets.WRANGLER_BETA_JSONC }}
          beta-tokens-json: ${{ secrets.BETA_TOKENS_JSON }}
      - name: Wake beta
        run: node scripts/wake-beta.mjs
      - name: Test beta through Access
        run: npx playwright test
        env:
          JUGGLE_TARGET: beta

  deploy-prod:
    name: deploy prod
    needs: test-beta
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hosting
        with:
          wrangler-jsonc: ${{ secrets.WRANGLER_JSONC }}
          wrangler-beta-jsonc: ${{ secrets.WRANGLER_BETA_JSONC }}
          beta-tokens-json: ${{ secrets.BETA_TOKENS_JSON }}
      # D1 keeps every database's history, so a bad migration is undone by
      # restoring to this bookmark with `wrangler d1 time-travel restore`.
      - name: Print the restore point of prod's database
        run: npx wrangler d1 time-travel info DB -c wrangler.jsonc
      - name: Migrate prod's database
        run: npx wrangler d1 migrations apply DB --remote -c wrangler.jsonc
      - name: Deploy prod
        run: WRANGLER_CONFIG=wrangler.jsonc npx vite build && npx wrangler deploy
