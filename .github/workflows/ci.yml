# A pull request runs the checks and tests. A push to main runs the deploy,
# which runs the same checks and tests first and stops at the first failure.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Every deploy's browser tests share beta's one database, so only one
    # deploy runs at a time, and a waiting one is never cancelled.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Write the hosting config git does not keep
        env:
          WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
          WRANGLER_BETA_JSONC: ${{ secrets.WRANGLER_BETA_JSONC }}
          BETA_TOKENS_JSON: ${{ secrets.BETA_TOKENS_JSON }}
        run: |
          printf '%s' "$WRANGLER_JSONC" > wrangler.jsonc
          printf '%s' "$WRANGLER_BETA_JSONC" > wrangler.beta.jsonc
          printf '%s' "$BETA_TOKENS_JSON" > beta-tokens.json
          node scripts/mask-hosting-values.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run deploy
